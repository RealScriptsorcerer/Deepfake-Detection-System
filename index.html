<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
            cursor: pointer;
        }
        .upload-area:hover {
            border-color: #007bff;
        }
        .preview-image {
            max-width: 100%;
            max-height: 300px;
            margin: 20px 0;
        }
        .result-box {
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .loading {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4">Deepfake Detection System</h1>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <div class="upload-area" id="dropZone">
                            <h5>Drag and drop an image/video here</h5>
                            <p>or</p>
                            <input type="file" id="fileInput" class="d-none" accept="image/*,video/*">
                            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                                Choose File
                            </button>
                        </div>

                        <div id="preview" class="text-center">
                            <img id="previewImage" class="preview-image" style="display: none;">
                            <video id="previewVideo" class="preview-image" style="display: none;" controls></video>
                        </div>

                        <div class="loading text-center" id="loading">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Analyzing media...</p>
                        </div>

                        <div class="result-box" id="resultBox">
                            <h4 class="text-center mb-3">Analysis Result</h4>
                            <div class="alert" id="resultAlert" role="alert"></div>
                            <div class="text-center">
                                <button class="btn btn-secondary" onclick="resetForm()">Analyze Another</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const previewVideo = document.getElementById('previewVideo');
        const loading = document.getElementById('loading');
        const resultBox = document.getElementById('resultBox');
        const resultAlert = document.getElementById('resultAlert');

        // Prevent default drag behaviors
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Handle dropped files
        dropZone.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', handleFileSelect, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            handleFiles(files);
        }

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    previewImage.style.display = 'block';
                    previewVideo.style.display = 'none';
                    previewImage.src = URL.createObjectURL(file);
                } else if (file.type.startsWith('video/')) {
                    previewImage.style.display = 'none';
                    previewVideo.style.display = 'block';
                    previewVideo.src = URL.createObjectURL(file);
                }
                
                // Show loading and send file for analysis
                analyzeMedia(file);
            }
        }

        function analyzeMedia(file) {
            loading.style.display = 'block';
            resultBox.style.display = 'none';
            
            const formData = new FormData();
            formData.append('file', file);

            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                loading.style.display = 'none';
                resultBox.style.display = 'block';
                
                if (data.error) {
                    resultAlert.className = 'alert alert-danger';
                    resultAlert.textContent = 'Error: ' + data.error;
                } else {
                    resultAlert.className = data.prediction === 'Real' ? 'alert alert-success' : 'alert alert-danger';
                    resultAlert.textContent = `Analysis Result: ${data.prediction}`;
                }
            })
            .catch(error => {
                loading.style.display = 'none';
                resultBox.style.display = 'block';
                resultAlert.className = 'alert alert-danger';
                resultAlert.textContent = 'Error analyzing media: ' + error.message;
            });
        }

        function resetForm() {
            fileInput.value = '';
            previewImage.style.display = 'none';
            previewVideo.style.display = 'none';
            resultBox.style.display = 'none';
            previewImage.src = '';
            previewVideo.src = '';
        }
    </script>
</body>
</html>
